
<style>
* { margin:0; padding:0; box-sizing:border-box; }
#wrap {
  width:100%; height:620px;
  position:relative; overflow:hidden;
  background: radial-gradient(ellipse at 45% 0%, #0b3060 0%, #041a30 40%, #010e1e 75%, #000508 100%);
}
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
const cv = document.getElementById('c');
const wp = document.getElementById('wrap');
const ct = cv.getContext('2d');
let W, H;

// max jalur aktif sekaligus
const MAX_STRANDS = 18;
const strands = [];

function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// bintang background statis
let stars = [];
function buildStars(){
  stars = [];
  for(let i=0;i<90;i++){
    stars.push({
      x:rnd(0,W), y:rnd(0,H),
      r:rnd(0.3,1.1),
      a:rnd(0.05,0.28),
      phase:rnd(0,Math.PI*2),
      spd:rnd(0.006,0.018)
    });
  }
}

function buildStrand(){
  const x = rnd(20, W-20);
  // jalur dimulai dari y=0 (atas)
  const segs = [];
  let cy = 0, curX = x;
  const totalH = rnd(H*0.35, H*0.82);
  while(cy < totalH){
    const vLen = rnd(50,130);
    const end = Math.min(cy+vLen, totalH);
    segs.push({x1:curX, y1:cy, x2:curX, y2:end});
    cy = end;
    if(cy >= totalH) break;
    const shift = rnd(20,60)*(Math.random()<0.5?1:-1);
    const nx = clamp(curX+shift, 20, W-20);
    if(Math.abs(nx-curX) > 10){
      segs.push({x1:curX, y1:cy, x2:nx, y2:cy});
      curX = nx;
    }
  }
  const g = Math.random();
  return {
    segs,
    tipX: curX, tipY: totalH,
    // fase: 'draw' -> 'hold' -> 'fade'
    phase: 'draw',
    drawProgress: 0,   // 0..1 proses menggambar dari atas
    drawSpeed: rnd(0.004, 0.008), // PELAN
    holdTimer: 0,
    holdDuration: rnd(90, 180),  // berapa frame ditahan sebelum fade
    fadeAlpha: 1,
    fadeSpeed: rnd(0.008, 0.015),
    baseAlpha: rnd(0.35, 0.65),
    isSuper: g < 0.08,
    isGlow:  g < 0.25,
    nodeR: rnd(3.5, 5.5),
    pulse: rnd(0,Math.PI*2),
    pulseSpd: rnd(0.015,0.035),
    // bead energi
    flowT: 0,
    flowSpd: rnd(0.005, 0.009),
    dead: false
  };
}

// hitung total panjang segs
function totalLen(segs){
  return segs.reduce((s,g)=>s+Math.hypot(g.x2-g.x1,g.y2-g.y1),0);
}
// titik di progress t (0..1)
function ptAt(segs,t){
  const tot = totalLen(segs);
  let d = t*tot;
  for(const s of segs){
    const l = Math.hypot(s.x2-s.x1, s.y2-s.y1);
    if(d<=l){
      const p = l?d/l:0;
      return {x:s.x1+(s.x2-s.x1)*p, y:s.y1+(s.y2-s.y1)*p};
    }
    d -= l;
  }
  return {x:segs[segs.length-1].x2, y:segs[segs.length-1].y2};
}

// ─── spawn manager: tambah jalur baru jika kurang dari MAX ───
let spawnCooldown = 0;
function spawnIfNeeded(){
  spawnCooldown--;
  const active = strands.filter(s=>!s.dead).length;
  if(active < MAX_STRANDS && spawnCooldown <= 0){
    strands.push(buildStrand());
    spawnCooldown = rnd(15,40); // jeda antar spawn (pelan)
  }
  // bersihkan yang sudah dead
  for(let i=strands.length-1;i>=0;i--){
    if(strands[i].dead) strands.splice(i,1);
  }
}

function glowDot(x,y,r,color,blur,alpha){
  ct.save();
  ct.shadowColor=color; ct.shadowBlur=blur;
  ct.globalAlpha=alpha;
  ct.fillStyle=color;
  ct.beginPath(); ct.arc(x,y,r,0,Math.PI*2); ct.fill();
  ct.restore();
}

function drawStrand(s){
  s.pulse += s.pulseSpd;
  const bright = 0.6 + 0.4*Math.sin(s.pulse);
  const masterAlpha = s.fadeAlpha; // dikontrol fase fade

  // ── update fase ──
  if(s.phase === 'draw'){
    s.drawProgress = Math.min(1, s.drawProgress + s.drawSpeed);
    if(s.drawProgress >= 1) s.phase = 'hold';
  } else if(s.phase === 'hold'){
    s.holdTimer++;
    if(s.holdTimer >= s.holdDuration) s.phase = 'fade';
  } else if(s.phase === 'fade'){
    s.fadeAlpha -= s.fadeSpeed;
    if(s.fadeAlpha <= 0){ s.dead = true; return; }
  }

  // clip sesuai drawProgress (gambar dari atas)
  const clipY = s.tipY * s.drawProgress;
  ct.save();
  ct.beginPath(); ct.rect(0, 0, W, clipY); ct.clip();

  const la = s.baseAlpha * bright * masterAlpha;

  // ── garis ──
  ct.save();
  if(s.isSuper){ ct.shadowColor='#00d8ff'; ct.shadowBlur=16; }
  else if(s.isGlow){ ct.shadowColor='#0088dd'; ct.shadowBlur=8; }
  ct.strokeStyle = `rgba(0,${s.isSuper?200:165},255,${la})`;
  ct.lineWidth = s.isSuper ? 1.3 : 0.85;
  ct.lineCap = 'round';
  ct.beginPath();
  s.segs.forEach((sg,i)=>{
    if(i===0) ct.moveTo(sg.x1, sg.y1);
    ct.lineTo(sg.x2, sg.y2);
  });
  ct.stroke();
  ct.restore();

  // ── corner dots ──
  for(let i=1;i<s.segs.length;i++){
    const sg = s.segs[i];
    ct.save();
    ct.shadowColor='#00bbff'; ct.shadowBlur=5;
    ct.fillStyle=`rgba(120,205,255,${la*0.8})`;
    ct.beginPath(); ct.arc(sg.x1,sg.y1,1.8,0,Math.PI*2); ct.fill();
    ct.restore();
  }

  // ── bead energi (hanya saat hold/draw selesai) ──
  if(s.phase !== 'fade'){
    s.flowT += s.flowSpd;
    if(s.flowT > 1) s.flowT = 0;
    const fp = ptAt(s.segs, Math.min(s.drawProgress, s.flowT > s.drawProgress ? s.drawProgress : s.flowT));
    // trail
    for(let t=1;t<=5;t++){
      const tt = Math.max(0, s.flowT - t*0.02);
      const tp = ptAt(s.segs, tt);
      ct.globalAlpha = (1-t/6)*0.45*bright*masterAlpha;
      ct.fillStyle='#00ccff';
      ct.beginPath(); ct.arc(tp.x,tp.y,1.4-t*0.15,0,Math.PI*2); ct.fill();
      ct.globalAlpha=1;
    }
    const bp = ptAt(s.segs, s.flowT);
    glowDot(bp.x,bp.y,2.5,'#00eeff',14,0.9*bright*masterAlpha);
    glowDot(bp.x,bp.y,1.2,'#ffffff',5,bright*masterAlpha);
  }

  // ── tip node ──
  if(s.drawProgress >= 1){
    const ta = s.baseAlpha * bright * masterAlpha;
    if(s.isSuper){
      [s.nodeR*6, s.nodeR*3.5].forEach((hr,i)=>{
        const g = ct.createRadialGradient(s.tipX,s.tipY,0,s.tipX,s.tipY,hr);
        g.addColorStop(0,`rgba(0,200,255,${ta*(i===0?0.1:0.22)})`);
        g.addColorStop(1,'rgba(0,0,0,0)');
        ct.fillStyle=g;
        ct.beginPath(); ct.arc(s.tipX,s.tipY,hr,0,Math.PI*2); ct.fill();
      });
      glowDot(s.tipX,s.tipY,s.nodeR*1.5,'#00eeff',28,ta*0.9);
      glowDot(s.tipX,s.tipY,s.nodeR*0.65,'#ffffff',10,ta);
    } else if(s.isGlow){
      const g = ct.createRadialGradient(s.tipX,s.tipY,0,s.tipX,s.tipY,s.nodeR*4);
      g.addColorStop(0,`rgba(0,170,255,${ta*0.5})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ct.fillStyle=g; ct.beginPath(); ct.arc(s.tipX,s.tipY,s.nodeR*4,0,Math.PI*2); ct.fill();
      glowDot(s.tipX,s.tipY,s.nodeR,'#7dd8ff',14,ta);
      glowDot(s.tipX,s.tipY,s.nodeR*0.5,'#cceeff',5,ta);
    } else {
      ct.fillStyle=`rgba(95,180,255,${ta*0.75})`;
      ct.beginPath(); ct.arc(s.tipX,s.tipY,s.nodeR*0.7,0,Math.PI*2); ct.fill();
    }
  }

  ct.restore(); // unclip
}

function frame(){
  ct.clearRect(0,0,W,H);

  // bintang
  stars.forEach(s=>{
    s.phase+=s.spd;
    const a=s.a*(0.4+0.6*Math.sin(s.phase));
    ct.globalAlpha=a;
    ct.fillStyle='#a0ccff';
    ct.beginPath(); ct.arc(s.x,s.y,s.r,0,Math.PI*2); ct.fill();
    ct.globalAlpha=1;
  });

  spawnIfNeeded();
  strands.forEach(s=>{ if(!s.dead) drawStrand(s); });

  requestAnimationFrame(frame);
}

function resize(){
  W = cv.width = wp.offsetWidth;
  H = cv.height = wp.offsetHeight || 620;
  buildStars();
  strands.length = 0;
}

resize();
requestAnimationFrame(frame);
let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(resize,150); });
})();
</script>
